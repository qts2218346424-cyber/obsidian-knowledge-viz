server {
    listen 80 default_server;
    listen 3001;
    listen 443 ssl;
    server_name claudexxb.online www.claudexxb.online 113.45.136.45 _;

    ssl_certificate /etc/nginx/ssl_claudexxb.crt;
    ssl_certificate_key /etc/nginx/ssl_claudexxb.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 200M;
    charset utf-8;

    # 1. 网关层静态维护与自动探活重连兜底页（零外部依赖，使用 503 透传 CDN 并严禁缓存）
    location = /_gateway_fallback.html {
        root /opt/coreforge/dist;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Retry-After "3" always;
    }

    # 2. API 接口网关异常 JSON 兜底（防止前端 fetch 在后端重启瞬间收到 HTML 导致解析报错）
    location = /_api_gateway_fallback.json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "3" always;
        return 503 '{"error":"研核云端服务正在瞬时热更新或重连中，请稍候数秒自动恢复","code":"GATEWAY_RECONNECTING","retryAfter":3}';
    }

    # 3. 客户端安装包静态极速直连分发 (内核级零拷贝与断点续传，不受 Node 后端影响)
    location /release/ {
        alias /opt/coreforge/release/;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
    }

    # 4. 带内容哈希的前端静态资源由 Nginx 内核直出（即使后端进程重启瞬间，静态资源加载也永不白屏）
    location /assets/ {
        root /opt/coreforge/dist;
        try_files $uri @coreforge_backend;
        sendfile on;
        tcp_nopush on;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. API 路由反向代理（5 秒快速探障兜底 JSON，600 秒长连接保障 AI 流式输出）
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_intercept_errors on;
        error_page 502 503 504 =503 /_api_gateway_fallback.json;
    }

    # 6. 主站页面与前端路由反向代理（后端异常或重启瞬间自动呈现静态重连兜底页，彻底告别纯白屏）
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 /_gateway_fallback.html;
    }

    location @coreforge_backend {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
