<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=dango2026" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=dango2026" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=dango2026" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=dango2026" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png?v=dango2026" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <!-- 采用现代标准化移动端 PWA 兼容元标签，彻底消除 apple-mobile-web-app-capable 弃用控制台警告 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="研核" />
    <meta name="description" content="CoreForge 研核 · 408计算机与考研数学/英语/政治全栈智能研学操作系统 &amp; Obsidian知识大脑。集成历年真题整卷库、LaTeX大题拆解导师、艾宾浩斯SM-2复习、3D知识拓扑与桌面伴学智能体。" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png?v=dango2026" />
    <title>CoreForge 研核 · Obsidian 考研全科智能研学操作系统</title>
    <!-- 本地优先高性能字体栈，彻底消除跨国字体阻塞白屏 -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        background: #F8FAFC;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
      }
      @keyframes cfBootFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .cf-boot-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: #334155;
        opacity: 0;
        animation: cfBootFadeIn 0.35s ease 0.45s forwards;
      }
      .cf-boot-card {
        max-width: 400px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 24px 20px;
        box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
      }
      .cf-boot-spinner {
        width: 26px;
        height: 26px;
        margin: 0 auto 12px;
        border: 2.5px solid #e2e8f0;
        border-top-color: #18181b;
        border-radius: 50%;
        animation: cfSpin 0.8s linear infinite;
      }
      @keyframes cfSpin {
        to { transform: rotate(360deg); }
      }
      .cf-boot-retry {
        display: none;
        margin-top: 14px;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .cf-boot-btn {
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid #18181b;
        background: #18181b;
        color: #fff;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }
      .cf-boot-btn-alt {
        background: #fff;
        color: #334155;
        border-color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="cf-boot-shell" id="cf-boot-fallback">
        <div class="cf-boot-card">
          <div class="cf-boot-spinner" aria-hidden="true"></div>
          <div id="cf-boot-title" style="font-size:14px;font-weight:700;color:#0f172a;">正在载入 CoreForge 研核空间…</div>
          <div id="cf-boot-desc" style="font-size:12px;color:#64748b;margin-top:6px;line-height:1.5;">首次加载或云端平滑热更新可能需要数秒，请稍候</div>
          <div id="cf-boot-actions" class="cf-boot-retry">
            <button type="button" class="cf-boot-btn" onclick="window.location.reload()">重新连接页面</button>
            <a href="/_gateway_fallback.html" class="cf-boot-btn cf-boot-btn-alt">查看节点状态与自动重连</a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        setTimeout(function () {
          var el = document.getElementById('cf-boot-fallback');
          if (!el) return;
          var t = document.getElementById('cf-boot-title');
          var d = document.getElementById('cf-boot-desc');
          var a = document.getElementById('cf-boot-actions');
          if (t) t.textContent = '云端服务正在瞬时重连或网络较慢';
          if (d) d.textContent = '链接有效未失效，您的笔记与错题数据均安全保留，可点击下方按钮重连：';
          if (a) a.style.display = 'flex';
        }, 6500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
