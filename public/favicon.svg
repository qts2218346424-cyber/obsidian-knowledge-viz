<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cf-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cf-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161824" />
      <stop offset="100%" stop-color="#0B0D13" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#cf-grad-bg)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Center Chip Node (408 CS) -->
  <g filter="url(#glow)">
    <!-- Circuit Pins Top -->
    <path d="M 52 42 L 52 28 M 64 42 L 64 24 M 76 42 L 76 28" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="52" cy="26" r="2.5" fill="#00D2FF" />
    <circle cx="64" cy="22" r="3" fill="#00D2FF" />
    <circle cx="76" cy="26" r="2.5" fill="#00D2FF" />

    <!-- Circuit Pins Bottom -->
    <path d="M 52 86 L 52 100 M 64 86 L 64 104 M 76 86 L 76 100" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="52" cy="102" r="2.5" fill="#10B981" />
    <circle cx="64" cy="106" r="3" fill="#10B981" />
    <circle cx="76" cy="102" r="2.5" fill="#10B981" />

    <!-- Central Microprocessor Frame -->
    <rect x="46" y="46" width="36" height="36" rx="6" fill="#12141F" stroke="url(#cf-grad-core)" stroke-width="2.5" />
    <circle cx="64" cy="64" r="4" fill="#00D2FF" />

    <!-- Infinity Loop Ribbon (Math & Continuity) -->
    <path d="M 64 64 C 48 44 26 44 26 64 C 26 84 48 84 64 64 C 80 44 102 44 102 64 C 102 84 80 84 64 64 Z" 
          fill="none" 
          stroke="url(#cf-grad-core)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Math Symbols Inside Loops -->
    <!-- Integral sign on the left loop -->
    <path d="M 39 56 C 39 53 37 52 35 52 C 33 52 33 54 33 57 L 33 71 C 33 74 31 76 29 76" 
          fill="none" 
          stroke="#00D2FF" 
          stroke-width="2.2" 
          stroke-linecap="round" />
    <!-- Sigma sign on the right loop -->
    <path d="M 97 54 L 89 54 L 93 64 L 89 74 L 97 74" 
          fill="none" 
          stroke="#A855F7" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
