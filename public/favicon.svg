<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- 暖奶油到樱花粉紫的背景渐变 -->
    <linearGradient id="bgGrad" x1="12" y1="8" x2="118" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7E8" />
      <stop offset="52%" stop-color="#FFE6EE" />
      <stop offset="100%" stop-color="#F6DAFA" />
    </linearGradient>

    <!-- 粉色大团子立体径向渐变 -->
    <radialGradient id="pinkDangoGrad" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFE6EE" />
      <stop offset="55%" stop-color="#FFC2D4" />
      <stop offset="100%" stop-color="#F29DB6" />
    </radialGradient>

    <!-- 天蓝色小团子立体径向渐变 -->
    <radialGradient id="blueDangoGrad" cx="40%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#DCF5FF" />
      <stop offset="55%" stop-color="#9CDDF7" />
      <stop offset="100%" stop-color="#6BBEE6" />
    </radialGradient>

    <!-- 腮红柔光渐变 -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7F9A" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#FF8DA5" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FF8DA5" stop-opacity="0" />
    </radialGradient>

    <!-- 樱花瓣渐变 -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDDE7" />
      <stop offset="100%" stop-color="#F8A8BF" />
    </linearGradient>

    <!-- 柔和底部投影 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C88AA6" stop-opacity="0.36" />
      <stop offset="100%" stop-color="#C88AA6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 圆角背景底板 -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- 团子底部的柔和阴影 -->
  <ellipse cx="58" cy="99" rx="41" ry="8" fill="url(#shadowGrad)" />
  <ellipse cx="94" cy="102" rx="21" ry="5.5" fill="url(#shadowGrad)" />

  <!-- 飘落的樱花瓣点缀 -->
  <path d="M98 20 C105 16 112 22 108 30 C104 37 96 36 93 33 C91 29 93 23 98 20 Z" fill="url(#petalGrad)" opacity="0.92" />
  <path d="M22 93 C28 90 34 95 31 101 C28 106 21 105 19 102 C17 99 19 95 22 93 Z" fill="url(#petalGrad)" opacity="0.88" />

  <!-- 粉色大团子主体（团子大家族标志性圆润馒头轮廓） -->
  <path
    d="M17 76
       C17 45 34 27 59 27
       C84 27 101 45 101 76
       C101 92 89 99 59 99
       C29 99 17 92 17 76 Z"
    fill="url(#pinkDangoGrad)"
  />
  <!-- 大团子顶部高光 -->
  <ellipse cx="47" cy="41" rx="16" ry="7" transform="rotate(-14 47 41)" fill="#FFFFFF" opacity="0.35" />

  <!-- 大团子腮红 -->
  <ellipse cx="38" cy="72" rx="10.5" ry="6.5" fill="url(#blushGrad)" />
  <ellipse cx="78" cy="72" rx="10.5" ry="6.5" fill="url(#blushGrad)" />

  <!-- 大团子招牌竖线眼睛 -->
  <rect x="47" y="54" width="4.4" height="13" rx="2.2" fill="#5A4A4F" />
  <rect x="65" y="54" width="4.4" height="13" rx="2.2" fill="#5A4A4F" />

  <!-- 天蓝色迷你小团子宝宝（依偎在右侧） -->
  <path
    d="M78 89
       C78 75 86 67 96.5 67
       C107 67 115 75 115 89
       C115 97 109.5 101 96.5 101
       C83.5 101 78 97 78 89 Z"
    fill="url(#blueDangoGrad)"
  />
  <!-- 小团子顶部高光 -->
  <ellipse cx="92" cy="74" rx="6.5" ry="3" transform="rotate(-12 92 74)" fill="#FFFFFF" opacity="0.38" />

  <!-- 小团子腮红与竖线眼睛 -->
  <ellipse cx="86" cy="88" rx="4.2" ry="2.6" fill="url(#blushGrad)" opacity="0.65" />
  <ellipse cx="101.5" cy="88" rx="4.2" ry="2.6" fill="url(#blushGrad)" opacity="0.65" />
  <rect x="88.2" y="78" width="2.6" height="6.8" rx="1.3" fill="#4C5663" />
  <rect x="96.5" y="78" width="2.6" height="6.8" rx="1.3" fill="#4C5663" />
</svg>
