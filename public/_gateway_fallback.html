<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>服务瞬时重连中 · CoreForge 研核官网 (claudexxb.online)</title>
  <style>
    :root {
      --bg-base: #f5f6f9;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #18181b;
      --text-muted: #64748b;
      --border-soft: rgba(226, 232, 240, 0.95);
      --accent-dark: #141417;
      --indigo: #4f46e5;
      --emerald: #10b981;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: var(--text-main);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(60% 42% at 50% 0%, rgba(79, 70, 229, 0.09) 0%, rgba(79, 70, 229, 0) 72%),
        radial-gradient(45% 35% at 85% 12%, rgba(16, 185, 129, 0.07) 0%, rgba(16, 185, 129, 0) 70%),
        linear-gradient(to right, rgba(24, 24, 27, 0.032) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(24, 24, 27, 0.032) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(1.25rem, env(safe-area-inset-top, 0px)) 1rem max(1.5rem, env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: 100%;
      max-width: 540px;
      background: #e4e5e9;
      padding: 8px;
      border-radius: 28px;
      box-shadow: 0 24px 60px -12px rgba(15, 23, 42, 0.14), 0 2px 6px rgba(15, 23, 42, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 28px 24px;
      border: 1px solid var(--border-soft);
    }

    @media (min-width: 640px) {
      .card {
        padding: 36px 34px;
      }
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(145deg, #27272a, #09090b);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    .brand-name {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
      transition: all 0.25s ease;
    }

    .status-pill.is-online {
      background: #ecfdf5;
      color: #065f46;
      border-color: #a7f3d0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .status-pill.is-online .dot {
      background: var(--emerald);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.88); }
    }

    h1 {
      font-size: clamp(1.25rem, 4.5vw, 1.55rem);
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 10px;
      text-wrap: balance;
    }

    .lead {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .probe-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .probe-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 9px;
    }

    .probe-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: #64748b;
    }

    .bar-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 35%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #10b981);
      transition: width 0.35s ease;
    }

    .reassurance-list {
      list-style: none;
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }

    .reassurance-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #334155;
    }

    .check-icon {
      width: 16px;
      height: 16px;
      color: var(--emerald);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
      }
    }

    button, .btn-link {
      appearance: none;
      border: none;
      border-radius: 13px;
      padding: 12px 18px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      min-height: 44px;
    }

    button:active, .btn-link:active {
      transform: scale(0.98);
    }

    .btn-primary {
      flex: 1.3;
      background: linear-gradient(180deg, #27272a 0%, #141417 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px -6px rgba(9, 9, 11, 0.35);
    }

    .btn-primary:hover {
      background: #09090b;
    }

    .btn-secondary {
      flex: 1;
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background: #f8fafc;
      color: #0f172a;
    }

    .footer-meta {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: #94a3b8;
    }

    .domain-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #475569;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      .dot, .bar-fill {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell" role="main">
    <div class="card">
      <div class="top-row">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">研</div>
          <span class="brand-name">CoreForge</span>
          <span class="brand-tag">研核网关守护</span>
        </div>
        <div id="status-pill" class="status-pill" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-badge-text">正在重连研学节点</span>
        </div>
      </div>

      <h1 id="main-heading">研核服务正在瞬时热更新或调度重连中</h1>
      <p id="main-lead" class="lead">
        您访问的网址完全正常（并非链接失效）。云端服务正在进行约 3～10 秒的平滑版本更新或进程重启，请稍候片刻，恢复后将自动为您无缝进入研学空间。
      </p>

      <div class="probe-box">
        <div class="probe-header">
          <span id="probe-title">自动健康探测运行中</span>
          <span id="probe-counter" class="probe-sub">3 秒后自动检测</span>
        </div>
        <div class="bar-track" aria-hidden="true">
          <div id="probe-bar" class="bar-fill"></div>
        </div>
      </div>

      <ul class="reassurance-list">
        <li class="reassurance-item">
          <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
          <span><strong>学习资产毫发无损</strong>：您的刷题记录、错题本与双链 Markdown 笔记均独立保存在持久化沙盒中。</span>
        </li>
        <li class="reassurance-item">
          <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
          <span><strong>无需反复手动关页</strong>：后台探测到服务就绪后将第一时间自动刷新回当前页面。</span>
        </li>
      </ul>

      <div class="actions">
        <button type="button" id="retry-now-btn" class="btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
          <span id="retry-btn-label">立即重新连接</span>
        </button>
        <button type="button" id="toggle-auto-btn" class="btn-secondary" aria-pressed="true">
          暂停自动重试
        </button>
      </div>

      <div class="footer-meta">
        <span>CoreForge 研核 · 考研全科智能研学系统</span>
        <span class="domain-badge">claudexxb.online</span>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var INTERVAL_SEC = 3;
      var remain = INTERVAL_SEC;
      var attempts = 0;
      var autoEnabled = true;
      var checking = false;
      var recovered = false;

      var pill = document.getElementById('status-pill');
      var badgeText = document.getElementById('status-badge-text');
      var heading = document.getElementById('main-heading');
      var lead = document.getElementById('main-lead');
      var probeTitle = document.getElementById('probe-title');
      var probeCounter = document.getElementById('probe-counter');
      var probeBar = document.getElementById('probe-bar');
      var retryBtn = document.getElementById('retry-now-btn');
      var retryLabel = document.getElementById('retry-btn-label');
      var toggleBtn = document.getElementById('toggle-auto-btn');

      function navigateBackToSite() {
        var currentPath = window.location.pathname || '/';
        if (currentPath.indexOf('_gateway_fallback') !== -1) {
          window.location.replace('/?t=' + Date.now());
        } else {
          window.location.reload();
        }
      }

      function markRecovered() {
        recovered = true;
        pill.className = 'status-pill is-online';
        badgeText.textContent = '云端节点已恢复在线';
        heading.textContent = '服务连接已恢复，正在为您进入研学空间...';
        lead.textContent = '节点热更新已完成，即将自动跳转。若浏览器未自动跳转，请点击下方按钮直接进入。';
        probeTitle.textContent = '健康检查通过 (HTTP 200)';
        probeCounter.textContent = '正在进入...';
        probeBar.style.width = '100%';
        retryLabel.textContent = '立即进入主站';
        setTimeout(navigateBackToSite, 450);
      }

      function checkHealth(manual) {
        if (checking || recovered) return;
        checking = true;
        attempts += 1;
        probeTitle.textContent = '正在探测云端节点状态 (第 ' + attempts + ' 次)...';
        probeBar.style.width = '78%';
        if (manual) {
          retryLabel.textContent = '正在检测连接...';
        }

        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timer = controller ? setTimeout(function () { controller.abort(); }, 3500) : null;

        fetch('/api/health?_t=' + Date.now(), {
          method: 'GET',
          cache: 'no-store',
          headers: { 'Accept': 'application/json' },
          signal: controller ? controller.signal : undefined
        })
          .then(function (res) {
            if (timer) clearTimeout(timer);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            if (data && data.status === 'ok') {
              markRecovered();
            } else {
              throw new Error('Not ready');
            }
          })
          .catch(function () {
            checking = false;
            remain = INTERVAL_SEC;
            retryLabel.textContent = '立即重新连接';
            probeBar.style.width = '28%';
            probeTitle.textContent = manual
              ? '节点仍在启动准备中，请再稍候几秒'
              : '自动健康探测运行中 (已尝试 ' + attempts + ' 次)';
            probeCounter.textContent = autoEnabled ? remain + ' 秒后自动重试' : '已暂停自动重试';
          });
      }

      retryBtn.addEventListener('click', function () {
        if (recovered) {
          navigateBackToSite();
        } else {
          checkHealth(true);
        }
      });

      toggleBtn.addEventListener('click', function () {
        autoEnabled = !autoEnabled;
        toggleBtn.setAttribute('aria-pressed', autoEnabled ? 'true' : 'false');
        toggleBtn.textContent = autoEnabled ? '暂停自动重试' : '恢复自动重试';
        probeCounter.textContent = autoEnabled ? remain + ' 秒后自动重试' : '已暂停自动重试';
      });

      setInterval(function () {
        if (!autoEnabled || checking || recovered) return;
        remain -= 1;
        if (remain <= 0) {
          checkHealth(false);
        } else {
          probeCounter.textContent = remain + ' 秒后自动重试';
          probeBar.style.width = Math.round(((INTERVAL_SEC - remain + 0.5) / INTERVAL_SEC) * 70) + '%';
        }
      }, 1000);

      // 首次打开 1.2 秒后立即执行首轮快速探活
      setTimeout(function () { checkHealth(false); }, 1200);
    })();
  </script>
</body>
</html>
